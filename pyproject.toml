[project]
name = "mastermechanicalagent"
version = "0.1.0"
description = "Google ADK HVAC assistant with BigQuery for Master Mechanical."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "google-adk>=1.15.1",
    "python-dotenv>=1.0.0",
    "ag-ui-adk>=0.6.5",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "openpyxl>=3.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
