[project]
name = "mastermechanicalagent"
version = "0.1.0"
description = "Google ADK HVAC assistant with BigQuery for Master Mechanical."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "google-adk>=1.15.1",
    "python-dotenv>=1.0.0",
    "ag-ui-adk>=0.6.5",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "openpyxl>=3.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/agents/MasterMechanicalAgent/agent.py" = ["E402", "I001"]
"tests/**" = ["I001"]
